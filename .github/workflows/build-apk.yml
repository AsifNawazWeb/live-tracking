name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL to bake into the APK (e.g. https://tracker.yourdomain.com)'
        required: true
        default: 'http://192.168.1.10:3000'
      registration_key:
        description: 'Optional REGISTRATION_KEY (must match server .env, leave empty if none)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: >
          gradle assembleDebug --no-daemon
          -PSERVER_URL='${{ github.event.inputs.server_url }}'
          -PREGISTRATION_KEY='${{ github.event.inputs.registration_key }}'
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
