name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL to bake into the APK — leave empty to use repo variable TRACKER_SERVER_URL (fallback: http://192.168.1.18:3000)'
        required: false
        default: ''
      registration_key:
        description: 'Optional REGISTRATION_KEY (must match server .env, leave empty if none)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Resolve server URL
        id: url
        run: |
          URL="${{ github.event.inputs.server_url }}"
          [ -z "$URL" ] && URL="${{ vars.TRACKER_SERVER_URL }}"
          [ -z "$URL" ] && URL="http://192.168.1.18:3000"
          echo "Baked SERVER_URL: $URL"
          echo "SERVER_URL=$URL" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: >
          gradle assembleDebug --no-daemon
          -PSERVER_URL='${{ steps.url.outputs.SERVER_URL }}'
          -PREGISTRATION_KEY='${{ github.event.inputs.registration_key }}'
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
