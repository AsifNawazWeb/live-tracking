plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.courier.tracker'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.courier.tracker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Server URL and optional registration key baked into the APK at build time.
        // Override with: gradle assembleDebug -PSERVER_URL=https://tracker.yourdomain.com
        def serverUrl = (project.findProperty('SERVER_URL') ?: 'http://192.168.1.10:3000').toString()
        def regKey = (project.findProperty('REGISTRATION_KEY') ?: '').toString()
        if (!serverUrl.startsWith('http://') && !serverUrl.startsWith('https://')) {
            serverUrl = "https://$serverUrl"
        }
        buildConfigField 'String', 'SERVER_URL', "\"${serverUrl.replace('"', '\\\\"')}\""
        buildConfigField 'String', 'REGISTRATION_KEY', "\"${regKey.replace('"', '\\\\"')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
